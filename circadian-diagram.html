  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

amily: 'Montserrat';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"516d07fd-a4fe-4fb8-9452-8a05aa14d94d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Montserrat';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"c73ae094-5bab-4fd9-8a95-eb6c690050b1\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Montserrat';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"d6ee148d-b0db-4787-a674-9ac0346238c8\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#242424;}\n@keyframes scw-pulse{0%,100%{box-shadow:0 0 0 4px rgba(255,255,255,.14),0 0 14px 3px rgba(242,109,61,.5)}50%{box-shadow:0 0 0 8px rgba(255,255,255,.04),0 0 24px 9px rgba(242,109,61,.7)}}\n<\u002Fstyle>\n<script src=\"fce603f6-1870-4526-98c7-dd5504eee3a4\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div ref=\"{{ rootRef }}\" style=\"font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;background:radial-gradient(125% 90% at 50% -12%,#333134 0%,#242424 62%);color:#fff;padding-bottom:30px;overflow:hidden;\">\n\n  <!-- HEADER -->\n  <div style=\"max-width:760px;margin:0 auto;text-align:center;padding:clamp(38px,6vw,66px) 24px clamp(6px,2vw,14px);\">\n    <div style=\"font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#ff8c00;\">The Swanwick circadian system<\u002Fdiv>\n    <h2 style=\"font-size:clamp(26px,4.4vw,40px);font-weight:800;letter-spacing:-.02em;margin:14px 0 0;line-height:1.1;color:#fff;text-wrap:balance;\">Work with your light, not against it<\u002Fh2>\n    <p style=\"font-size:clamp(14px,1.6vw,16px);color:#b9bab8;max-width:560px;margin:14px auto 0;line-height:1.6;font-weight:400;\">Swanwick blue-light glasses and warm lighting keep your body clock in rhythm — focused and bright by day, calm and ready for sleep by night.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- ===================== DESKTOP ===================== -->\n  <sc-if value=\"{{ isWide }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"position:relative;max-width:1000px;margin:0 auto;padding:clamp(54px,7vw,80px) clamp(24px,13vw,180px);\">\n    <div style=\"position:relative;width:100%;max-width:452px;aspect-ratio:1;margin:0 auto;\">\n\n      <!-- glow -->\n      <div style=\"position:absolute;inset:-7%;border-radius:50%;background:conic-gradient(from 0deg at 50% 50%,#7a2620 0%,#9f2f24 10%,#b8382d 20%,#d06a2e 30%,#e8b847 42%,#f5f3f0 52%,#f0e0b0 62%,#e8b847 72%,#ff8c00 82%,#c85a1e 90%,#b8382d 96%,#7a2620 100%);filter:blur(26px);opacity:.5;\"><\u002Fdiv>\n      <!-- ring band -->\n      <div style=\"position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg at 50% 50%,#7a2620 0%,#9f2f24 10%,#b8382d 20%,#d06a2e 30%,#e8b847 42%,#f5f3f0 52%,#f0e0b0 62%,#e8b847 72%,#ff8c00 82%,#c85a1e 90%,#b8382d 96%,#7a2620 100%);-webkit-mask:radial-gradient(circle closest-side at 50% 50%,transparent 0 60%,#000 65% 80%,transparent 83%);mask:radial-gradient(circle closest-side at 50% 50%,transparent 0 60%,#000 65% 80%,transparent 83%);\"><\u002Fdiv>\n      <!-- hand -->\n      <div style=\"position:absolute;left:50%;bottom:50%;width:2px;height:38%;transform-origin:bottom center;transform:translateX(-50%) {{ handRot }};background:linear-gradient(to top,transparent,#ffffff 55%);z-index:3;pointer-events:none;\"><\u002Fdiv>\n      <!-- now dot -->\n      < ht:14px;border-radius:50%;background:#f5f3f0;border:3px solid #242424;box-shadow:0 0 0 1px #f5f3f0;margin-top:4px;\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.04em;color:#f5f3f0;\">12:00 PM · DAYTIME<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:700;color:#fff;margin-top:2px;\">Focus <span style=\"color:#f5f3f0;\">Swannies<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:13px;color:#b9bab8;margin-top:3px;line-height:1.45;\">For productive, screen-heavy hours — cut glare and eye strain without distorting colour.<\u002Fdiv>\n          <div style=\"margin-top:10px;display:inline-flex;padding:4px;border:1.5px solid rgba(111,179,189,.5);border-radius:12px;background:rgba(255,255,255,.03);\"><img src=\"b4b8c7cd-cf31-4dd9-8693-23949c78efea\" alt=\"Focus Swannies\" style=\"width:86px;height:58px;object-fit:cover;border-radius:9px;display:block;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position:relative;display:flex;gap:15px;padding:11px 6px;\">\n        <div style=\"flex:none;width:48px;display:flex;justify-content:center;\"><div style=\"width:14px;height:14px;border-radius:50%;background:#e8b847;border:3px solid #242424;box-shadow:0 0 0 1px #e8b847;margin-top:4px;\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.04em;color:#e8b847;\">6:00 PM · EVENING<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:700;color:#fff;margin-top:2px;\">Relax <span style=\"color:#e8b847;\">Swannies<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:13px;color:#b9bab8;margin-top:3px;line-height:1.45;\">Daylight fades. Ease into the night and start winding down naturally.<\u002Fdiv>\n          <div style=\"margin-top:10px;display:inline-flex;padding:4px;border:1.5px solid rgba(244,160,106,.5);border-radius:12px;background:rgba(255,255,255,.03);\"><img src=\" div style=\"font-size:13px;color:#b9bab8;margin-top:3px;line-height:1.45;\">Sleep in a cool, blacked-out room. If you must get up, use Swanwick anti-blue lighting.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- footer caption -->\n  <div style=\"text-align:center;padding:8px 24px 2px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#6f7173;\">Blue light blocking glasses · Swanwick®<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:780},&quot;useLiveTime&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Live time marker&quot;},&quot;previewHour&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:19,&quot;min&quot;:0,&quot;max&quot;:23.5,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;h&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Live time marker&quot;},&quot;use24Hour&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Live time marker&quot;}}\">\nclass Component extends DCLogic {\n  state = { w: 1000, now: new Date() };\n\n  componentDidMount() {\n    this._tick = setInterval(() => this.setState({ now: new Date() }), 1000);\n    const el = this._root;\n    if (typeof ResizeObserver !== 'undefined' && el) {\n      this._ro = new ResizeObserver((es) => {\n        const w = es[0].contentRect.width;\n        if (Math.abs(w - this.state.w) > 2) this.setState({ w });\n      });\n      this._ro.observe(el);\n    }\n  }\n  componentWillUnmount() {\n    if (this._tick) clearInterval(this._tick);\n    if (this._ro) this._ro.disconnect();\n  }\n\n  renderVals() {\n    const p = this.props || {};\n    const live = p.useLiveTime !== false;\n    const n = this.state.now;\n    let h, hh, mm;\n    if (live) {\n      hh = n.getHours(); mm = n.getMinutes();\n      h = hh + mm / 60 + n.getSeconds() / 3600;\n    } else {\n      h = (typeof p.previewHour === 'number') ? p.previewHour : 19;\n      hh = Math.floor(h) % 24;\n      mm = Math.round((h - Math.floor(h)) * 60);\n    }\n    const angle = (h / 24) * 360;\n    const rad = angle * Math.PI / 180;\n    const dotR = 36;\n    const dotLeft = (50 + dotR * Math.sin(rad)).toFixed(2) + '%';\n    const dotTop = (50 - dotR * Math.cos(rad)).toFixed(2) + '%';\n\n    let timeStr;\n    if (p.use24Hour === true) {\n      timeStr = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');\n    } else {\n      const ap = hh < 12 ? 'AM' : 'PM';\n      let h12 = hh % 12; if (h12 === 0) h12 = 12;\n      timeStr = h12 + ':' + String(mm).padStart(2, '0') + ' ' + ap;\n    }\n\n    let phaseLabel, phaseGlasses, phaseColor;\n    if (h >= 5 && h < 8)        { phaseLabel = 'Sunrise';   phaseGlasses = 'Soak up natural light'; phaseColor = '#f5f3f0'; }\n    else if (h >= 8 && h < 17)  { phaseLabel = 'Daytime';   phaseGlasses = 'Focus Swannies on';     phaseColor = '#f5f3f0'; }\n    else if (h >= 17 && h < 21) { phaseLabel = 'Evening';   phaseGlasses = 'Relax Swannies on';     phaseColor = '#e8b847'; }\n    else if (h >= 21 && h < 23.5){ phaseLabel = 'Wind down'; phaseGlasses = 'Sleep Swannies on';     phaseColor = '#ff8c00'; }\n    else                        { phaseLabel = 'Night';     phaseGlasses = 'Lights low — sleep';    phaseColor = '#f0e6d2'; }\n\n    const w = this.state.w;\n    return {\n      isWide: w >= 760,\n      isNarrow: w < 760,\n      handRot: 'rotate(' + angle.toFixed(2) + 'deg)',\n      dotLeft, dotTop, timeStr, phaseLabel, phaseGlasses, phaseColor,\n      rootRef: (el) => { this._root = el; }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
